name: Update Iranian domain list

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate validated list
        run: node scripts/update-domain-list.mjs
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- lists/iranian-domains.json; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "iran-direct-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists/iranian-domains.json
          git commit -m "Update Iranian domain list"
          git push

