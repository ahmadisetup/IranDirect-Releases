name: Publish extension assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-extension-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Upload Chrome extension files to v0.4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.4.0 \
            downloads/iran-direct-v0.4.0-friends.zip \
            downloads/iran-direct-v0.4.0-friends.zip.sha256 \
            enterprise/iran-direct-enterprise-v0.4.0.crx \
            enterprise/iran-direct-enterprise-v0.4.0.crx.sha256 \
            --clobber

      - name: Update release notes with installation choices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          IranDirect v0.4.0

          ### نصب افزونه Chrome روی سیستم‌های معمولی
          فایل `iran-direct-v0.4.0-friends.zip` را دانلود و کامل Extract کنید. سپس در Chrome به `chrome://extensions` بروید، **Developer mode** را روشن کنید، **Load unpacked** را بزنید و پوشه استخراج‌شده را انتخاب کنید.

          ### نصب شرکتی ویندوز
          `IranDirectSetup-v0.4.0.exe` برای نصب شرکتی و تشخیص خودکار System Proxy است. نصب خودکار افزونه self-hosted در Chrome روی Windows به محیط مدیریت‌شده/Active Directory وابسته است.

          ### فایل CRX
          `iran-direct-enterprise-v0.4.0.crx` نسخه امضاشده برای استقرار مدیریت‌شده و به‌روزرسانی سازمانی است؛ برای نصب دستی روی سیستم معمولی، ZIP بالا پیشنهاد می‌شود.

          فایل‌های `.sha256` برای بررسی صحت دانلود قرار داده شده‌اند.
          EOF
          gh release edit v0.4.0 --notes-file /tmp/release-notes.md
